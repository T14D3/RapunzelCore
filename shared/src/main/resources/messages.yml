  # ============================================
  # MODERATION COMMANDS
  # ============================================
  ban:
    success:
      permanent: "<green>Permanently banned <gold><arg1> <green>for: <white><arg2>"
      temporary: "<green>Temporarily banned <gold><arg1> <green>for <gold><arg2> <green>for: <white><arg3>"
    broadcast:
      permanent: "<red><bold>[BAN]</bold> <gold><arg1> <red>was permanently banned by <gold><arg2> <red>for: <white><arg3>"
      temporary: "<red><bold>[BAN]</bold> <gold><arg1> <red>was temporarily banned by <gold><arg2> <red>for <gold><arg3> <red>for: <white><arg4>"
    error:
      bypass: "<red>You cannot ban <gold><arg1><red> - they have moderation bypass permission."
      no_permanent: "<red>You do not have permission to issue permanent bans."
  
  unban:
    success: "<green>Unbanned <gold><arg1>"
    broadcast: "<green><bold>[UNBAN]</bold> <gold><arg1> <green>was unbanned by <gold><arg2>"
    error:
      not_banned: "<red><gold><arg1> <red>is not banned."
  
  kick:
    success: "<green>Kicked <gold><arg1> <green>for: <white><arg2>"
    broadcast: "<yellow><bold>[KICK]</bold> <gold><arg1> <yellow>was kicked by <gold><arg2> <yellow>for: <white><arg3>"
    message: "<red>You were kicked: <white><arg1> <gray>(by <arg2>)"
    error:
      bypass: "<red>You cannot kick <gold><arg1><red> - they have moderation bypass permission."
  
  mute:
