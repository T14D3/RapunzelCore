      cannot_leave: "<red>You cannot leave the jail area!"
      cannot_teleport: "<red>You cannot teleport while jailed!"
    expired: "<green>Your jail time has expired. You have been released."
  
  unjail:
    success: "<green>Released <gold><arg1> <green>from jail"
    broadcast: "<green><bold>[UNJAIL]</bold> <gold><arg1> <green>was released from jail by <gold><arg2>"
    notify: "<green>You have been released from jail by <gold><arg1>"
    error:
      not_jailed: "<red><gold><arg1> <red>is not jailed."
  
  setjail:
    success: "<green>Jail location set to <gold><arg1> <green>at <gold><arg2>, <arg3>, <arg4>"
  
  warn:
    success: "<green>Warned <gold><arg1> <green>for: <white><arg2> <gray>(Warning #<arg3>)"
    broadcast: "<yellow><bold>[WARN]</bold> <gold><arg1> <yellow>was warned by <gold><arg2> <yellow>for: <white><arg3> <gray>(#<arg4>)"
