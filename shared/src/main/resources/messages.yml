      permanent: "<green>Permanently muted <gold><arg1> <green>for: <white><arg2>"
      temporary: "<green>Temporarily muted <gold><arg1> <green>for <gold><arg2> <green>for: <white><arg3>"
    broadcast:
      permanent: "<red><bold>[MUTE]</bold> <gold><arg1> <red>was permanently muted by <gold><arg2> <red>for: <white><arg3>"
      temporary: "<red><bold>[MUTE]</bold> <gold><arg1> <red>was temporarily muted by <gold><arg2> <red>for <gold><arg3> <red>for: <white><arg4>"
    notify:
      permanent: "<red>You have been permanently muted by <gold><arg1> <red>for: <white><arg2>"
      temporary: "<red>You have been temporarily muted by <gold><arg1> <red>for <gold><arg2> <red>for: <white><arg3>"
    error:
      already_muted: "<red><gold><arg1> <red>is already muted."
      no_permanent: "<red>You do not have permission to issue permanent mutes."
  
  unmute:
    success: "<green>Unmuted <gold><arg1>"
    broadcast: "<green><bold>[UNMUTE]</bold> <gold><arg1> <green>was unmuted by <gold><arg2>"
    notify: "<green>You have been unmuted by <gold><arg1>"
    error:
      not_muted: "<red><gold><arg1> <red>is not muted."
  
  jail:
    success:
      permanent: "<green>Jailed <gold><arg1> <green>for: <white><arg2>"
      temporary: "<green>Jailed <gold><arg1> <green>for <gold><arg2> <green>for: <white><arg3>"
    broadcast:
      permanent: "<red><bold>[JAIL]</bold> <gold><arg1> <red>was jailed by <gold><arg2> <red>for: <white><arg3>"
      temporary: "<red><bold>[JAIL]</bold> <gold><arg1> <red>was jailed by <gold><arg2> <red>for <gold><arg3> <red>for: <white><arg4>"
    notify:
      permanent: "<red>You have been jailed by <gold><arg1> <red>for: <white><arg2>"
      temporary: "<red>You have been jailed by <gold><arg1> <red>for <gold><arg2> <red>for: <white><arg3>"
    error:
