# Item Frame Tools Module Configuration
#
# This module provides enhanced item frame management:
# - Toggle visibility (make frames invisible)
# - Lock/unlock frames (prevent item removal/rotation)
# - Toggle glowing effect
# - Pass-through interactions to containers behind frames

# Maximum distance for targeting item frames with commands
max-distance: 5.0

# Pass-through settings - allows interacting with containers behind item frames
pass-through:
  enabled: true
  require-item: true

# Invisibility settings - toggle item frame visibility
invisibility:
  enabled: true
  tool: SHEARS
  require-sneak: true
  permission: rapunzelcore.itemframe.invisible

# Lock settings - lock/unlock item frames to prevent modification
lock:
  enabled: true
  tool: GLASS_PANE
  require-sneak: true
  permission: rapunzelcore.itemframe.lock

# Glow settings - toggle glowing effect on item frames
glow:
  enabled: true
  tool: GLOWSTONE
  require-sneak: true
  permission: rapunzelcore.itemframe.glow

# Sound feedback for actions
sounds:
  enabled: true

# Messages (can be customized, use MiniMessage format)
messages:
  prefix: "<dark_gray>[<aqua>ItemFrame<dark_gray>] <reset>"
