# ============================================
# RapunzelCore Utility Commands Configuration
# ============================================

# Player Time (ptime) settings
ptime:
  # Default time values shown in suggestions
  default-times:
    - 0      # Sunrise
    - 6000   # Morning
    - 12000  # Noon
    - 18000  # Evening
    - 24000  # Night
  
  # Time names for display
  time-names:
    sunrise: "Sunrise"
    morning: "Morning"
    noon: "Noon"
    afternoon: "Afternoon"
    sunset: "Sunset"
    evening: "Evening"
    midnight: "Midnight"
    night: "Night"

# Player Weather (pweather) settings
pweather:
  # Available weather types
  weather-types:
    - clear
    - downfall
    - reset
  
  # Display names for weather types
  display-names:
    clear: "Clear"
    downfall: "Rain/Snow"
    reset: "Server Weather"

# Hat command settings
hat:
  # Whether to allow any item to be used as hat
  allow-all-items: true
  
  # List of allowed item types (if allow-all-items is false)
  allowed-items:
    - CARVED_PUMPKIN
    - JACK_O_LANTERN
    - PLAYER_HEAD
    - CREEPER_HEAD
    - ZOMBIE_HEAD
    - SKELETON_SKULL
    - WITHER_SKELETON_SKULL
    - DRAGON_HEAD
  
  # List of blocked item types (checked even if allow-all-items is true)
  blocked-items:
    - AIR
    - BEDROCK
    - COMMAND_BLOCK
    - CHAIN_COMMAND_BLOCK
    - REPEATING_COMMAND_BLOCK
    - BARRIER
    - STRUCTURE_BLOCK
    - JIGSAW
  
  # Whether to allow blocks with inventories (chests, shulker boxes, etc.)
  allow-inventory-blocks: false
  
  # Whether to play a sound when putting on a hat
  play-sound: true
  
  # Sound to play (if play-sound is true)
  sound: "ITEM_ARMOR_EQUIP_GENERIC"

# Skull command settings
skull:
  # Cooldown between skull requests (in seconds, 0 = no cooldown)
  cooldown-seconds: 0
  
  # Maximum skulls per player per day (0 = unlimited)
  max-per-day: 0
  
  # Whether to allow requesting own skull
  allow-own-skull: true
  
  # Whether skulls should have lore with player name
  add-lore: true
  
  # Lore format (use {player} for player name placeholder)
  lore-format:
    - "<gray>Head of <gold>{player}"
    - "<dark_gray>Generated by RapunzelCore"
  
  # Whether to allow custom skull textures (by URL)
  allow-custom-textures: false
  
  # Permission required for custom textures
  custom-texture-permission: "rapunzelcore.skull.custom"

# Trash command settings
trash:
  # Inventory size (must be multiple of 9, max 54)
  inventory-size: 54
  
  # Inventory title (supports MiniMessage format)
  title: "<red>Trash - Items will be deleted!"
  
  # Whether to confirm deletion
  confirm-deletion: false
  
  # Whether to play sound when items are deleted
  play-delete-sound: true
  
  # Sound to play when deleting
  delete-sound: "BLOCK_LAVA_EXTINGUISH"
  
  # Whether to log trash deletions to console
  log-deletions: true
  
  # Items to ignore (won't be deleted)
  ignored-items: []

# Recipe command settings
recipe:
  # Whether to show alternative recipes
  show-alternatives: true
  
  # Maximum number of recipes to show
  max-results: 5
  
  # Whether to include furnace recipes
  include-furnace: true
  
  # Whether to include blast furnace recipes
  include-blast-furnace: true
  
  # Whether to include smoker recipes
  include-smoker: true
  
  # Whether to include campfire recipes
  include-campfire: true
  
  # Whether to include smithing recipes
  include-smithing: true
  
  # Whether to include stonecutter recipes
  include-stonecutter: true
  
  # Whether to include brewing recipes (if available)
  include-brewing: false
  
  # Display format for recipes
  display:
    # Header format
    header: "<gold>=== Recipe: <yellow>{item} <gold>==="
    
    # Footer format
    footer: "<green>Result: <aqua>{item}"
    
    # Recipe type labels
    type-labels:
      shaped: "<blue>Type: <aqua>Shaped Recipe (Crafting Table)"
      shapeless: "<blue>Type: <aqua>Shapeless Recipe (Crafting Table)"
      furnace: "<blue>Type: <aqua>Furnace Recipe"
      blast-furnace: "<blue>Type: <aqua>Blast Furnace Recipe"
      smoker: "<blue>Type: <aqua>Smoker Recipe"
      campfire: "<blue>Type: <aqua>Campfire Recipe"
      smithing: "<blue>Type: <aqua>Smithing Recipe (Smithing Table)"
      stonecutter: "<blue>Type: <aqua>Stonecutter Recipe"

# General utility settings
utility:
  # Whether to log command usage to console
  log-usage: false
  
  # Whether to send usage statistics (anonymized)
  send-statistics: false
